<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="main">


    <!-- CABECALHO -->
    <header class="header"></header>


    <!-- BOTÃO CENTRAL -->
    <div class="top-actions">
      <a href="laudo.html" class="link-btn">
        <button class="novo">+ Novo Laudo</button>
      </a>
    </div>


    <!-- BUSCAR -->
    <div class="search-bar">
      <input type="text" placeholder="Buscar...">
    </div>


    <!-- TABELA -->
    <table>
      <thead>
        <tr>
          <th>Processo</th>
          <th>Reclamante</th>
          <th>Reclamada</th>
          <th>Data</th>
          <th>Local</th>
          <th>Tipo da Pericia</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="9" class="empty">
            Nenhum dado encontrado
          </td>
        </tr>
      </tbody>
    </table>


  </div>


</body>
</html>
