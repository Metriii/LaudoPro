<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Novo Laudo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ==========================
       ESTILOS BÁSICOS
    =========================== */
    .conteudo { display: none; }
    .active { background-color: #ddd; font-weight: bold; }
    .campo { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
    .linha { margin: 20px 0; border: 0; border-top: 1px solid #ccc; }
    label { font-weight: bold; display: block; margin-top: 10px; margin-bottom: 5px; color: #555; }
    .endereco input, .local-trabalho input { margin-right: 5px; }
    .salvar-area { margin-top: 20px; }
  </style>
</head>
<body>
  <a href="index.html" class="voltar">⬅ Voltar</a>

  <div class="main">
    <h1 class="titulo">Novo Laudo</h1>

    <div class="box">
      <!--==========================
             TABS
      ============================-->
    <div class="tabs">
      <button class="tab-btn active" data-tipo="Periculosidade" onclick="trocarAba(event, 'periculosidade'); pegarTipo(this)">Periculosidade</button>
      <button class="tab-btn" data-tipo="Insalubridade" onclick="trocarAba(event, 'insalubridade'); pegarTipo(this)">Insalubridade</button>
      <button class="tab-btn" data-tipo="Periculosidade-Insalubridade" onclick="trocarAba(event, 'periculosidade-insalubridade'); pegarTipo(this)">Periculosidade/Insalubridade</button>
    </div>



      <!--==========================
          PERICULOSIDADE
      ============================-->
<div id="periculosidade" class="conteudo" style="display:block;">

  <input type="text" id="numero-processo-peric" placeholder="N° do Processo">

  <div id="lista-reclamantes-peric">
    <div class="campo">
      <input type="text" placeholder="Reclamante">
      <button type="button" onclick="adicionarReclamante('lista-reclamantes-peric')">+</button>
      <button type="button" onclick="removerReclamante(this)">-</button>
    </div>
  </div>

  <div id="lista-reclamadas-peric">
    <div class="campo">
      <input type="text" placeholder="Reclamada">
      <button type="button" onclick="adicionarCampo('lista-reclamadas-peric')">+</button>
      <button type="button" onclick="removerCampo(this)">-</button>
    </div>
  </div>

  <hr class="linha">

  <div id="container-peric"></div>
  <div id="container-documentos-peric"></div>

  <hr class="linha">

  <div class="endereco">
    <input type="text" id="rua-peric" placeholder="Rua">
    <input type="text" id="numero-peric" placeholder="Número">
    <input type="text" id="bairro-peric" placeholder="Bairro">
    <input type="text" id="cidade-peric" placeholder="Cidade">
  </div>

  <hr class="linha">

  <div class="local-trabalho">
    <input type="text" id="local-peric" placeholder="Local de Trabalho">
    <input type="text" id="paredes-peric" placeholder="Paredes">
    <input type="text" id="pisos-peric" placeholder="Pisos">
    <input type="text" id="iluminacao-peric" placeholder="Iluminação">
    <input type="text" id="ventilacao-peric" placeholder="Ventilação">
  </div>

  <hr class="linha">

  <div>
    <input type="text" id="data-pericia-peric" placeholder="Data Perícia"
      onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
    
    <input type="text" id="data-laudo-peric" placeholder="Data Laudo"
      onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
  </div>

  <div class="salvar-area">
    <button class="salvar" onclick="enviarPericulosidade()">
      Salvar
    </button>
  </div>
</div>

<!--==========================
          INSALUBRIDADE
============================-->
<div id="insalubridade" class="conteudo" style="display:none;">

  <input type="text" id="numero-processo-insalub" placeholder="N° do Processo">

  <div id="lista-reclamantes-insalub">
    <div class="campo">
      <input type="text" placeholder="Reclamante">
      <button type="button" onclick="adicionarReclamante('lista-reclamantes-insalub')">+</button>
      <button type="button" onclick="removerReclamante(this)">-</button>
    </div>
  </div>

  <div id="lista-reclamadas-insalub">
    <div class="campo">
      <input type="text" placeholder="Reclamada">
      <button type="button" onclick="adicionarCampo('lista-reclamadas-insalub')">+</button>
      <button type="button" onclick="removerCampo(this)">-</button>
    </div>
  </div>

  <hr class="linha">

  <div id="container-insalub"></div>
  <div id="container-documentos-insalub"></div>

  <hr class="linha">

  <div class="endereco">
    <input type="text" id="rua-insalub" placeholder="Rua">
    <input type="text" id="numero-insalub" placeholder="Número">
    <input type="text" id="bairro-insalub" placeholder="Bairro">
    <input type="text" id="cidade-insalub" placeholder="Cidade">
  </div>

  <hr class="linha">

  <div class="local-trabalho">
    <input type="text" id="local-insalub" placeholder="Local de Trabalho">
    <input type="text" id="paredes-insalub" placeholder="Paredes">
    <input type="text" id="pisos-insalub" placeholder="Pisos">
    <input type="text" id="iluminacao-insalub" placeholder="Iluminação">
    <input type="text" id="ventilacao-insalub" placeholder="Ventilação">
  </div>

  <hr class="linha">

  <div>
    <input type="text" id="data-pericia-insalub" placeholder="Data Perícia"
      onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
    
    <input type="text" id="data-laudo-insalub" placeholder="Data Laudo"
      onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
  </div>

  <div class="salvar-area">

</div>
      <!--==========================
         PERICULOSIDADE / INSALUBRIDADE
      ============================-->
      <!--==========================
   PERICULOSIDADE + INSALUBRIDADE (AMBOS)
============================-->
<div id="periculosidade-insalubridade" class="conteudo" style="display:none;">

  <input type="text" id="numero-processo-ambos" placeholder="N° do Processo">

  <!-- RECLAMANTES -->
  <div id="lista-reclamantes-ambos">
    <div class="campo">
      <input type="text" placeholder="Reclamante">
      <button type="button" onclick="adicionarReclamante('lista-reclamantes-ambos')">+</button>
      <button type="button" onclick="removerReclamante(this)">-</button>
    </div>
  </div>

  <!-- RECLAMADAS -->
  <div id="lista-reclamadas-ambos">
    <div class="campo">
      <input type="text" placeholder="Reclamada">
      <button type="button" onclick="adicionarCampo('lista-reclamadas-ambos')">+</button>
      <button type="button" onclick="removerCampo(this)">-</button>
    </div>
  </div>

  <hr class="linha">

  <!-- ANEXOS / DOCUMENTOS -->
  <div id="container-ambos-peric"></div>
  <div id="container-ambos-insalub"></div>
  <div id="container-documentos-ambos"></div>

  <hr class="linha">

  <!-- ENDEREÇO -->
  <div class="endereco">
    <input type="text" id="rua-ambos" placeholder="Rua">
    <input type="text" id="numero-ambos" placeholder="Número">
    <input type="text" id="bairro-ambos" placeholder="Bairro">
    <input type="text" id="cidade-ambos" placeholder="Cidade">
  </div>

  <hr class="linha">

  <!-- LOCAL DE TRABALHO -->
  <div class="local-trabalho">
    <input type="text" id="local-ambos" placeholder="Local de Trabalho">
    <input type="text" id="paredes-ambos" placeholder="Paredes">
    <input type="text" id="pisos-ambos" placeholder="Pisos">
    <input type="text" id="iluminacao-ambos" placeholder="Iluminação">
    <input type="text" id="ventilacao-ambos" placeholder="Ventilação">
  </div>

  <hr class="linha">

  <!-- DATAS -->
  <div>
    <input type="text" id="data-pericia-ambos" placeholder="Data Perícia"
           onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">

    <input type="text" id="data-laudo-ambos" placeholder="Data Laudo"
           onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
  </div>

  <div class="salvar-area">
    <button class="salvar" onclick="enviarAmbos()">
      Salvar
    </button>
  </div>

</div>


  </div>

  <!--==========================
        SCRIPTS
  ============================-->
  <script>
    // ==========================
    // FUNÇÕES DE RECLAMANTES E RECLAMADAS
    // ==========================
    function adicionarReclamante(idContainer) {
      const container = document.getElementById(idContainer);
      const div = document.createElement('div');
      div.classList.add('campo');
      div.innerHTML = `
        <input type="text" placeholder="Reclamante">
        <button type="button" onclick="adicionarReclamante('${idContainer}')">+</button>
        <button type="button" onclick="removerReclamante(this)">-</button>`;
      container.appendChild(div);
    }

    function removerReclamante(botao) {
      if (botao.parentElement.parentElement.children.length > 1) botao.parentElement.remove();
    }

    function adicionarCampo(idContainer) {
      const container = document.getElementById(idContainer);
      const div = document.createElement('div');
      div.classList.add('campo');
      div.innerHTML = `
        <input type="text" placeholder="Reclamada">
        <button type="button" onclick="adicionarCampo('${idContainer}')">+</button>
        <button type="button" onclick="removerCampo(this)">-</button>`;
      container.appendChild(div);
    }

    function removerCampo(botao) {
      if (botao.parentElement.parentElement.children.length > 1) botao.parentElement.remove();
    }

    // ==========================
    // FUNÇÃO DE TROCAR ABAS
    // ==========================
    function trocarAba(event, aba) {
      document.querySelectorAll('.conteudo').forEach(div => div.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(aba).style.display = 'block';
      event.target.classList.add('active');
    }
    // ==========================
    // FUNÇÕES DE ANEXOS
    // ==========================
    function criarSelect(tipo, placeholder) {
      const select = document.createElement("select");
      select.style.color = "#999";

      // Placeholder
      const placeholderOption = document.createElement("option");
      placeholderOption.value = "";
      placeholderOption.textContent = placeholder;
      placeholderOption.disabled = true;
      placeholderOption.selected = true;
      select.appendChild(placeholderOption);

      const limite = (tipo === 'peric') ? 5 : 14;

      for (let i = 1; i <= limite; i++) {

        if (tipo === 'insalub' && i === 4) continue;

        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Anexo ${i}`;
        select.appendChild(opt);
      }

      if (tipo === 'peric') {
        const optEstrela = document.createElement("option");
        optEstrela.value = "*";
        optEstrela.textContent = "Anexo *";
        select.appendChild(optEstrela);
      }

      select.addEventListener("change", () => select.style.color = "#333");
      return select;
    }

    function adicionarAnexo(idContainer, tipo, placeholder) {
      const container = document.getElementById(idContainer);
      const div = document.createElement("div");
      div.classList.add("campo");

      const select = criarSelect(tipo, placeholder);

      const btnAdd = document.createElement("button");
      btnAdd.type = "button";
      btnAdd.textContent = "+";
      btnAdd.onclick = () => adicionarAnexo(idContainer, tipo, placeholder);

      const btnRem = document.createElement("button");
      btnRem.type = "button";
      btnRem.textContent = "-";
      btnRem.onclick = () => { if(container.children.length > 1) div.remove(); };

      div.append(select, btnAdd, btnRem);
      container.appendChild(div);
    }

    // ==========================
    // FUNÇÕES DE DOCUMENTOS
    // ==========================
    function criarSelectDocumento() {
      const select = document.createElement("select");
      select.style.color = "#999";

      // Placeholder (mensagem inicial)
      const placeholderOption = document.createElement("option");
      placeholderOption.value = "";
      placeholderOption.textContent = "Selecione os Documentos";
      placeholderOption.disabled = true;
      placeholderOption.selected = true;
      select.appendChild(placeholderOption);

      // Opções
      const opcoes = ["PGR", "EPI", "FDS", "LTCAT", "PCMSO", "ASO"];
      opcoes.forEach(op => {
        const opt = document.createElement("option");
        opt.value = op;
        opt.textContent = op;
        select.appendChild(opt);
      });

      select.addEventListener("change", () => select.style.color = "#333");

      return select;
    }

    function adicionarDocumento(idContainer) {
      const container = document.getElementById(idContainer);
      const div = document.createElement("div");
      div.classList.add("campo");

      const select = criarSelectDocumento();

      const btnAdd = document.createElement("button");
      btnAdd.type = "button";
      btnAdd.textContent = "+";
      btnAdd.onclick = () => adicionarDocumento(idContainer);

      const btnRem = document.createElement("button");
      btnRem.type = "button";
      btnRem.textContent = "-";
      btnRem.onclick = () => { if(container.children.length > 1) div.remove(); };

      div.append(select, btnAdd, btnRem);
      container.appendChild(div);
    }

    // ==========================
    // INICIALIZAÇÃO
    // ==========================
    window.addEventListener('DOMContentLoaded', () => {
      // Aba Periculosidade
      adicionarAnexo('container-peric', 'peric', 'Selecione Anexo Periculosidade');
      adicionarDocumento('container-documentos-peric');

      // Aba Insalubridade
      adicionarAnexo('container-insalub', 'insalub', 'Selecione Anexo Insalubridade');
      adicionarDocumento('container-documentos-insalub');

      // Aba Ambos
      adicionarAnexo('container-ambos-peric', 'peric', 'Selecione Anexo Periculosidade');
      adicionarAnexo('container-ambos-insalub', 'insalub', 'Selecione Anexo Insalubridade');
      adicionarDocumento('container-documentos-ambos');
    });

//=========================
// FUNÇÕES DE ENVIAR DADOS LAUDOS
// ==========================
// inicializa com o botão ativo já selecionado
let tipoSelecionado = document.querySelector(".tab-btn.active")?.dataset.tipo;

// função chamada ao clicar nos botões de tipo
function pegarTipo(botao) {
  tipoSelecionado = botao.dataset.tipo; // pega do atributo data-tipo
  console.log("Tipo selecionado:", tipoSelecionado);

  // atualizar visual do botão ativo
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  botao.classList.add("active");
}

function pegarLista(idContainer) {
  const inputs = document.querySelectorAll(`#${idContainer} input`);
  const lista = [];

  inputs.forEach(input => {
    if (input.value.trim()) {
      lista.push(input.value.trim());
    }
  });

  return lista;
}
function pegarListaReclamada(idContainer) {
  const inputs = document.querySelectorAll(`#${idContainer} input`);
  const lista = [];

  inputs.forEach(input => {
    if (input.value.trim()) {
      lista.push(input.value.trim());
    }
  });

  return lista;
}

function pegarListaAnexos(idContainer) {
  const selects = document.querySelectorAll(`#${idContainer} select`);
  const lista = [];

  selects.forEach(select => {
    if (select.value) {
      lista.push(select.value);
    }
  });

  return lista;
}

function pegarListaDocumentos(idContainer) {
  const selects = document.querySelectorAll(`#${idContainer} select`);
  const lista = [];

  selects.forEach(select => {
    if (select.value) {
      lista.push(select.value);
    }
  });

  return lista;
}

function pegarNumeroProcesso() {
  const input = document.getElementById("numero-processo");
  return input.value.trim();
}

function pegarLocalTrabalho() {
  return {
    local: document.getElementById("local").value.trim(),
    paredes: document.getElementById("paredes").value.trim(),
    pisos: document.getElementById("pisos").value.trim(),
    iluminacao: document.getElementById("iluminacao").value.trim(),
    ventilacao: document.getElementById("ventilacao").value.trim()
  };
}
function pegarEndereco() {
  return {
    rua: document.getElementById("rua").value.trim(),
    numero: document.getElementById("numero").value.trim(),
    bairro: document.getElementById("bairro").value.trim(),
    cidade: document.getElementById("cidade").value.trim()
  };
}
function formatarData(idCampo) {
  const valor = document.getElementById(idCampo).value;
  if (!valor) return "";
  
  const [ano, mes, dia] = valor.split("-");
  return `${dia}/${mes}/${ano}`;
}

async function enviarPericulosidade() {
  try {
    const dados = {
      tipo: tipoSelecionado,
      numeroPericia: document.getElementById("numero-processo-peric").value,

      reclamantes: pegarLista("lista-reclamantes-peric"),
      reclamadas: pegarLista("lista-reclamadas-peric"),
      anexos: pegarListaAnexos("container-peric"),
      documentos: pegarListaDocumentos("container-documentos-peric"),

      localTrabalho: {
        local: document.getElementById("local-peric").value,
        paredes: document.getElementById("paredes-peric").value,
        pisos: document.getElementById("pisos-peric").value,
        iluminacao: document.getElementById("iluminacao-peric").value,
        ventilacao: document.getElementById("ventilacao-peric").value
      },

      endereco: {
        rua: document.getElementById("rua-peric").value,
        numero: document.getElementById("numero-peric").value,
        bairro: document.getElementById("bairro-peric").value,
        cidade: document.getElementById("cidade-peric").value
      },

      dataLaudo: formatarData("data-laudo-peric"),
      dataPericia: formatarData("data-pericia-peric")
    };

    console.log("Enviando PERICULOSIDADE:", dados);

    await fetch("http://localhost:5000/api/laudo-pericu", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });

  } catch (erro) {
    console.error("ERRO PERICULOSIDADE:", erro);
  }
}

async function enviarInsalubridade() {
  try {
    const dados = {
      tipo: tipoSelecionado,
      numeroPericia: document.getElementById("numero-processo-insalub").value,

      reclamantes: pegarLista("lista-reclamantes-insalub"),
      reclamadas: pegarLista("lista-reclamadas-insalub"),
      anexos: pegarListaAnexos("container-insalub"),
      documentos: pegarListaDocumentos("container-documentos-insalub"),

      localTrabalho: {
        local: document.getElementById("local-insalub").value,
        paredes: document.getElementById("paredes-insalub").value,
        pisos: document.getElementById("pisos-insalub").value,
        iluminacao: document.getElementById("iluminacao-insalub").value,
        ventilacao: document.getElementById("ventilacao-insalub").value
      },

      endereco: {
        rua: document.getElementById("rua-insalub").value,
        numero: document.getElementById("numero-insalub").value,
        bairro: document.getElementById("bairro-insalub").value,
        cidade: document.getElementById("cidade-insalub").value
      },

      dataLaudo: formatarData("data-laudo-insalub"),

    };

    console.log("Enviando INSALUBRIDADE:", dados);

    await fetch("http://localhost:5000/api/laudo-insalub", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });

  } catch (erro) {
    console.error("ERRO INSALUBRIDADE:", erro);
  }
}

async function enviarAmbos() {
  try {
    const dados = {
      tipo: tipoSelecionado,

      numeroPericia: document.getElementById("numero-processo-ambos").value,

      reclamantes: pegarLista("lista-reclamantes-ambos"),
      reclamadas: pegarLista("lista-reclamadas-ambos"),

      anexosPericulosidade: pegarListaAnexos("container-ambos-peric"),
      anexosInsalubridade: pegarListaAnexos("container-ambos-insalub"),

      documentos: pegarListaDocumentos("container-documentos-ambos"),

      endereco: {
        rua: document.getElementById("rua-ambos").value,
        numero: document.getElementById("numero-ambos").value,
        bairro: document.getElementById("bairro-ambos").value,
        cidade: document.getElementById("cidade-ambos").value
      },

      localTrabalho: {
        local: document.getElementById("local-ambos").value,
        paredes: document.getElementById("paredes-ambos").value,
        pisos: document.getElementById("pisos-ambos").value,
        iluminacao: document.getElementById("iluminacao-ambos").value,
        ventilacao: document.getElementById("ventilacao-ambos").value
      },

      dataPericia: formatarData("data-pericia-ambos"),

    };

    console.log("ENVIANDO AMBOS:", dados);

    await fetch("http://localhost:5000/api/laudo-ambos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });

  } catch (erro) {
    console.error("ERRO AO ENVIAR AMBOS:", erro);
  }
}



</script>
